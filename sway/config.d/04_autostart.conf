# Startup Applications & Daemons

# Wayland / D-Bus activation environment
exec_always dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway DISPLAY

# Authentication agent (supports lxqt, gnome, or kde agents)
exec /usr/bin/lxqt-policykit-agent || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1

# Core desktop services
exec waybar
exec mako
exec autotiling -l 2
exec nm-applet --indicator
exec blueman-applet

# Wallpaper daemon and initial background
exec_always swww-daemon
exec_always --no-startup-id bash ~/.config/sway/scripts/wallpaper.sh

# Clipboard history
exec_always wl-paste --type text --watch cliphist store
exec_always wl-paste --type image --watch cliphist store

# NWG shell wrappers
exec nwg-wrapper -t sway.pango -p right -mr 10
exec nwg-wrapper -s quick.sh -a end -p left -ml 10 -mb 10 -r 60
exec nwg-wrapper -s quote.sh -p left -a end -mb 10 -ml 260
