# Appearance, Colors & Window Decorations

# Font
font pango:Iosevka Nerd Font Mono 12

# Tokyo Night Colorscheme
set $bg0     #1a1b26
set $bg1     #24283b
set $fg      #c0caf5
set $black   #15161e
set $red     #f7768e
set $green   #9ece6a
set $yellow  #e0af68
set $blue    #7aa2f7
set $magenta #bb9af7
set $cyan    #7dcfff
set $white   #c0caf5
set $orange  #ff9e64
set $gray    #565f89

# Window decorations & styling
corner_radius 12
blur enable
blur_radius 2
blur_passes 2
default_dim_inactive 0.1

# Borders & Gaps
gaps inner 4
gaps outer 4
default_border pixel 2
titlebar_padding 8 2
titlebar_border_thickness 2

# Window border colors: class border background text indicator child_border
client.focused          $blue $bg1 $fg $blue $blue
client.focused_inactive $bg0  $bg0 $fg $bg0  $bg0
client.unfocused        $bg0  $bg0 $fg $bg0  $bg0
client.urgent           $red  $bg1 $fg $red  $red
