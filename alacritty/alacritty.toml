[window]
opacity = 0.60
blur = true
dynamic_title = true

[window.padding]
x = 10
y = 10

[font]
size = 16.0

[colors.primary]
background = "#000000"
foreground = "#ebdbb2"

[terminal.shell]
program = "/usr/bin/zsh"


[scrolling]
history = 10000
multiplier = 3


[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
action = "ScrollPageDown"



[[keyboard.bindings]]
key = "="
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
